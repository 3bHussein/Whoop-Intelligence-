<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP Intelligence — Data & Privacy</title><style>:root{color-scheme:dark}body{background:#08171b;color:#edf9f6;font:16px/1.65 system-ui;margin:0}main{max-width:680px;margin:8vh auto;padding:22px}.panel{background:#14292e;border:1px solid #375960;border-radius:18px;padding:20px;margin:14px 0}a{color:#81e8c9}button{background:#62e0b8;border:0;padding:13px 18px;border-radius:10px;color:#06251b;font-weight:700;cursor:pointer}button.danger{background:#f6ac9b;color:#411b1b}button:disabled{opacity:.5}.muted{color:#b2c6c6}#status{overflow-wrap:anywhere}</style><link rel="stylesheet" href="assets/dashboard.css"></head><body><main><a href="analysis.html#settings">← WHOOP Intelligence</a><button id="lang" style="float:right">العربية</button><h1 id="heading">My data & privacy</h1><p id="desc" class="muted"></p><section class="panel"><h2 id="conn">Connection status</h2><p id="state"></p><p id="count"></p><button id="update">Refresh status</button></section><section class="panel"><h2 id="export-title">Download my WHOOP data</h2><p id="export-desc" class="muted"></p><button id="export">Export JSON</button></section><section class="panel"><h2 id="delete-title">Disconnect & delete local records</h2><p id="delete-desc" class="muted"></p><button class="danger" id="disconnect">Disconnect and delete</button></section><p id="status" role="status"></p></main><script type="module">

const supabase=createClient("https://jsfeybhgobmrydcfnyjg.supabase.co","sb_publishable_r9VwkZmu87A1OBvoI8vZbg_B_LhDMPJ");const $=x=>document.getElementById(x);let lang=localStorage.getItem("whoop-lang")==="ar"?"ar":"en";
const langs={en:{heading:"My data & privacy",desc:"Manage the WHOOP data stored by WHOOP Intelligence.",conn:"Connection status",update:"Refresh status",yes:"WHOOP is connected",no:"Not connected",count:"Saved WHOOP records",export:"Download my WHOOP data",exportDesc:"Export saved records as JSON. Requests above 20,000 records fail explicitly without silently truncating.",exportButton:"Export JSON",delete:"Disconnect & delete local records",deleteDesc:"Deletes WHOOP Intelligence's saved records and OAuth tokens for this account. We also attempt to revoke WHOOP authorization. If WHOOP cannot confirm it, revoke separately in WHOOP connected-app settings. This action cannot be undone.",deleteButton:"Disconnect and delete",confirm:"Permanently delete your locally stored WHOOP records and tokens? You may need to revoke WHOOP's permission separately.",success:"Local WHOOP data and credentials deleted.",revoked:"WHOOP authorization also revoked.",revokePending:"WHOOP revocation was not confirmed. Revoke access in WHOOP connected-app settings.",failed:"Request failed."},ar:{heading:"بياناتي والخصوصية",desc:"إدارة بيانات WHOOP المخزنة في WHOOP Intelligence.",conn:"حالة الاتصال",update:"تحديث الحالة",yes:"WHOOP متصل",no:"غير متصل",count:"السجلات المحفوظة",export:"تنزيل بيانات WHOOP",exportDesc:"تصدير السجلات المحفوظة بصيغة JSON. إذا تجاوزت 20000 سجل يفشل الطلب بوضوح دون حذف جزء من التصدير.",exportButton:"تصدير JSON",delete:"فصل الحساب وحذف السجلات المحلية",deleteDesc:"يحذف سجلات WHOOP والتوكنات من WHOOP Intelligence. نحاول أيضًا إلغاء التفويض لدى WHOOP. إذا لم يؤكّد الإلغاء، ألغِ الصلاحية من إعدادات التطبيقات المتصلة في WHOOP. لا يمكن التراجع.",deleteButton:"فصل وحذف",confirm:"هل تريد حذف سجلات WHOOP وتوكنات الاتصال المحلية نهائيًا؟ قد تحتاج لإلغاء التفويض في WHOOP بشكل منفصل.",success:"تم حذف البيانات المحلية والتوكنات.",revoked:"تم أيضًا إلغاء تفويض WHOOP.",revokePending:"لم يتأكد إلغاء تفويض WHOOP؛ ألغِه من إعدادات التطبيقات المتصلة في WHOOP.",failed:"فشل الطلب."}};
const show=()=>{const t=langs[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lang").textContent=lang==="ar"?"English":"العربية";for(const [id,key] of [["heading","heading"],["desc","desc"],["conn","conn"],["update","update"],["export-title","export"],["export-desc","exportDesc"],["export","exportButton"],["delete-title","delete"],["delete-desc","deleteDesc"],["disconnect","deleteButton"]])$(id).textContent=t[key]};
async function call(action,extra={}){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error("Sign in / سجل دخول");const response=await fetch("https://jsfeybhgobmrydcfnyjg.supabase.co/functions/v1/whoop-account",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:"sb_publishable_r9VwkZmu87A1OBvoI8vZbg_B_LhDMPJ","content-type":"application/json"},body:JSON.stringify({action,...extra})});const result=await response.json();if(!response.ok)throw Error(result.error||"Request failed");return result}
async function update(){try{const r=await call("status");$("state").textContent=r.connected?langs[lang].yes:langs[lang].no;$("count").textContent=langs[lang].count+": "+r.records;$("status").textContent=""}catch(e){$("status").textContent=e.message}}

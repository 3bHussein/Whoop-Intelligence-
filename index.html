<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WHOOP Intelligence</title><link rel="stylesheet" href="assets/dashboard.css"><style>main{max-width:840px;padding-top:5vh}h1{font-size:clamp(38px,7vw,65px);max-width:680px}.notice{padding:28px}label,input{display:block;width:100%}input{padding:13px;background:#0b131b;color:white;border:1px solid #465866;border-radius:10px;margin:8px 0 16px}#connected[hidden],#login[hidden]{display:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}</style></head><body><main><header class="topbar"><a class="logo" href="./">WHOOP <span>INTELLIGENCE</span></a><button id="lang">العربية</button></header><p class="eyebrow" id="tag"></p><h1 id="heading"></h1><p class="muted" id="intro"></p><div class="actions"><a class="button primary" id="analysis" href="analysis.html"></a><a class="button" id="privacyLink" href="data.html"></a></div><section class="notice"><h2 id="connection"></h2><p class="muted" id="description"></p><div id="login"><label id="emailLabel" for="email"></label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button class="primary" id="send"></button></div><div id="connected" hidden><p><strong id="who"></strong></p><button class="primary" id="connect"></button><p class="muted" id="scope"></p><button id="logout"></button></div><p id="status" class="status" role="status" aria-live="polite"></p></section><footer class="footer"><a href="privacy.html" id="policy"></a> · <a href="https://github.com/3bHussein/Whoop-Intelligence-">GitHub</a></footer></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.4";
const supabase=createClient("https://jsfeybhgobmrydcfnyjg.supabase.co","sb_publishable_r9VwkZmu87A1OBvoI8vZbg_B_LhDMPJ");
let lang=localStorage.getItem('whoop-lang')==='ar'?'ar':'en';
const translations={en:{tag:'PERSONAL HEALTH ANALYTICS',heading:'Understand your own patterns.',intro:'Recovery, sleep and training in one personal perspective. Independent of WHOOP.',connection:'Your secure connection',description:'Sign in with a one-time email link. Your WHOOP password is never collected.',emailLabel:'Your email',send:'Send sign-in link',connect:'Connect WHOOP',logout:'Sign out',scope:'WHOOP authorization is optional. You control access to your recovery, sleep, cycles, workouts, profile and body measurements.',analysis:'Open your dashboard',privacyLink:'Data & privacy',policy:'Privacy policy'},ar:{tag:'تحليلاتك الصحية الشخصية',heading:'افهم أنماط جسمك.',intro:'الاستشفاء والنوم والتدريب في صورة شخصية واحدة. تطبيق مستقل عن WHOOP.',connection:'اتصالك الآمن',description:'سجّل الدخول برابط يُرسل إلى بريدك. لا نطلب كلمة مرور WHOOP.',emailLabel:'بريدك الإلكتروني',send:'إرسال رابط الدخول',connect:'ربط WHOOP',logout:'تسجيل الخروج',scope:'تفويض WHOOP اختياري. تتحكم في الوصول لبيانات الاستشفاء والنوم والدورات والتمرين والملف الشخصي وقياسات الجسم.',analysis:'افتح لوحة المتابعة',privacyLink:'البيانات والخصوصية',policy:'سياسة الخصوصية'}};
function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';for(const [id,v] of Object.entries(translations[lang]))document.getElementById(id).textContent=v;document.getElementById('lang').textContent=lang==='ar'?'English':'العربية'}
document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('whoop-lang',lang);translate()};translate();
const el=id=>document.getElementById(id),message=s=>{el("status").textContent=s};
async function refresh(){const {data:{session}}=await supabase.auth.getSession();el("login").hidden=!!session;el("connected").hidden=!session;el("who").textContent=session?.user?.email||""}
el("send").onclick=async()=>{const email=el("email").value.trim();if(!email)return message(lang==="ar"?"أدخل بريدك الإلكتروني أولًا.":"Enter your email first.");el("send").disabled=true;try{const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});message(error?error.message:(lang==="ar"?"راجع بريدك لفتح رابط الدخول.":"Check your email for a sign-in link."))}finally{el("send").disabled=false}};
el("connect").onclick=async()=>{el("connect").disabled=true;try{const {data:{session}}=await supabase.auth.getSession();if(!session)return message("Please sign in first.");const res=await fetch("https://jsfeybhgobmrydcfnyjg.supabase.co/functions/v1/whoop-start",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":"sb_publishable_r9VwkZmu87A1OBvoI8vZbg_B_LhDMPJ","Content-Type":"application/json"}});const data=await res.json();if(!res.ok)throw Error(data.error||"Unable to begin authorization");const url=new URL(data.authorization_url);if(url.origin!=="https://api.prod.whoop.com")throw Error("Unexpected OAuth host");location.assign(url.href)}catch(e){message(e.message)}finally{el("connect").disabled=false}};
el("logout").onclick=async()=>{await supabase.auth.signOut();await refresh();message(lang==="ar"?"تم تسجيل الخروج.":"Signed out.")};
supabase.auth.onAuthStateChange(()=>setTimeout(refresh,0));await refresh();
</script></body></html>

name: Verify WHOOP Intelligence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/build-site.mjs
        env:
          SITE_RELEASE: ${{ github.sha }}
      - run: npm run test:browser
        env:
          ALL_BROWSERS: '1'
          WHOOP_SITE_ROOT: _site
